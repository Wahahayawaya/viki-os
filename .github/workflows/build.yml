name: build

on:
  push:
    branches: [ 'feat/**' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc gcc-multilib make binutils \
            xorriso mtools \
            grub-pc-bin grub-common \
            qemu-system-x86

      - name: Build kernel
        run: make clean && make

      - name: Build ISO
        run: make iso

      - name: Boot test in QEMU
        run: |
          timeout -s KILL 8 qemu-system-i386 -cdrom viki-os.iso -m 256 \
            -display none -serial file:serial.raw || true
          echo "raw size: $(wc -c < serial.raw) bytes"
          head -c 200000 serial.raw > serial.log
          echo "truncated: $(wc -c < serial.log) bytes"
          echo "----- first 4KB -----"
          head -c 4000 serial.log
          echo ""
          echo "---------------------"
          grep -q "process_create: pid=1 name=idle" serial.log
          grep -q "process_create: pid=2 name=a" serial.log
          test $(grep -o "A" serial.log | wc -l) -gt 10
          test $(grep -o "B" serial.log | wc -l) -gt 10

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log
          path: |
            serial.log
            serial.raw
